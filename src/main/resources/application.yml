spring:
  application:
    name: db-connect-mcp
  data:
    redis:
      # Demo Redis instance; use empty credentials if authentication is disabled.
      host: localhost
      port: 6379
      database: 0
      username: "demo"
      password: "demo_redis_password"
  ai:
    mcp:
      server:
        name: db-connect-mcp
        version: 0.1.0
        # false: Streamable HTTP with the existing launch scripts; true: agent-launched stdio, no HTTP port or bearer auth.
        stdio: false
        protocol: STREAMABLE
        type: SYNC
        instructions: "Read and write access to the current JDBC database and Redis instance. JDBC data source switches apply to all clients and are memory-only. DDL requires dbmcp.write.allow-ddl. Credentials are never exposed in tool results."
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /db-mcp

server:
  # Listen on all interfaces; set SERVER_ADDRESS=127.0.0.1 for local access only.
  address: 0.0.0.0
  port: ${SERVER_PORT:8283}

dbmcp:
  auth:
    enabled: true
    # Demo token only; use a random secret for deployment and restart after changing it.
    # Clients send: Authorization: Bearer demo-db-mcp-token-0123456789abcdef
    token: "demo-db-mcp-token-0123456789abcdef"
  database:
    # Demo startup connection; startup requires a reachable database with valid credentials.
    url: "jdbc:mysql://localhost:3306/demo_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
    username: "demo"
    password: "demo_db_password"
    # Optional metadata filter; empty uses the connection default and does not change SQL name resolution.
    schema: ""
    # HikariCP pool sizing; connection-timeout is measured in milliseconds.
    max-active: 20
    min-idle: 5
    connection-timeout: 5000
  switch:
    # Total deadline includes waiting for concurrent switches; valid range is 1-300 seconds.
    timeout-seconds: 15
    # JDBC validation and driver login timeout; must not exceed the total deadline.
    validation-timeout-seconds: 5
  query:
    max-rows: 100
    timeout-seconds: 10
    max-cell-chars: 4000
  write:
    # Disable to reject DDL; DML remains available. Read and write tools share the current JDBC pool.
    allow-ddl: true
  redis:
    # Allowed logical database indexes range from 0 to max-databases minus one.
    max-databases: 16
    max-scan-count: 100
    max-items: 100
    max-value-chars: 4000
